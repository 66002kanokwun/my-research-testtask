<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Code Quality Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" integrity="sha512-ZwR1/gSZM3ai6vCdI+LVF1zSq/5HznD3ZSTk7kajkaj4D292NLuduDCO1c/NT8Id+jE58KYLKT7hXnbtryGmMg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>AI Code Quality Dashboard</h1>
<div class="bar">
  <!-- Dropdown Task (ให้ JS ไปโหลดข้อมูลมาใส่) -->
  <select id="task" aria-label="Task">
    <option value="">Loading tasks...</option>
  </select>
  
  <select id="provider" aria-label="AI provider">
    <option value="">default provider</option>
    <option value="deepseek">deepseek</option>
    <option value="mock">mock</option>
  </select>
  
  <button id="run" type="button">Run task</button>
  <button id="refresh" type="button" style="background:var(--muted)">Refresh</button>
</div>

<div class="cards" id="cards"></div>

<div class="grid2">
  <div class="card"><canvas id="issues"></canvas></div>
  <div class="card"><canvas id="cov"></canvas></div>
</div>

<div class="wrap">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Task</th>
        <th>Status</th>
        <th data-tooltip="AI Provider / Model ที่ใช้สร้างโค้ด">Provider / Model</th> <!-- คอลัมน์ใหม่ -->
        <th data-tooltip="Bugs: ข้อผิดพลาดที่ทำให้โปรแกรมทำงานผิดพลาด (ควรเป็น 0)">Bugs</th>
        <th data-tooltip="Vuln: ช่องโหว่ความปลอดภัย (ควรเป็น 0)">Vuln</th>
        <th data-tooltip="Smells: โค้ดที่เขียนไม่ดี ทำให้ดูแลรักษายาก">Smells</th>
        <th data-tooltip="Coverage: % ของโค้ดที่ถูกเทสต์ (ควร > 80%)">Cov %</th>
        <th data-tooltip="Dup %: % ของโค้ดที่ซ้ำกัน (ควร < 3%)">Dup %</th>
        <th data-tooltip="LOC: จำนวนบรรทัดโค้ด">LOC</th>
        <th data-tooltip="Debt: เวลาที่ต้องใช้ในการแก้โค้ดให้สมบูรณ์ (นาที)">Debt (min)</th>
        <th data-tooltip="Func %: % ของ Acceptance Test ที่ผ่าน (ควรเป็น 100%)">Func %</th>
        <th data-tooltip="Modules: จำนวนไฟล์/โมดูลในระบบ">Modules</th>
        <th data-tooltip="Cycles: การ import วนกันไปมา (ควรเป็น 0)">Cycles</th>
        <th data-tooltip="Orphans: ไฟล์ที่ไม่มีใคร import และไม่ import ใคร (โค้ดขยะ)">Orphans</th>
        <th data-tooltip="Instab.: ความไม่เสถียรของการพึ่งพา (0=เสถียร, 1=แกว่ง)">Instab.</th>
        <th data-tooltip="Rel/Sec/Maint: คะแนน Reliability / Security / Maintainability (A ดีสุด, E แย่สุด)">Ratings</th>
        <th data-tooltip="Sonar: ลิงก์ไปดูผลการสแกนใน SonarQube">Sonar</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  
  <!-- Pagination Controls -->
  <div class="pagination">
    <button id="prev-btn" style="background:var(--muted)">Previous</button>
    <span id="page-info">Page 1 of 1</span>
    <button id="next-btn" style="background:var(--muted)">Next</button>
  </div>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
