<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Code Quality Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e4e4df; --ok:#1d9e75; --bad:#d85a30; --warn:#ba7517; --accent:#378add; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161614; --card:#1f1f1c; --text:#ecece8; --muted:#9a9a93; --line:#33332f; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); padding:24px; }
  h1 { font-size:20px; margin:0 0 16px; }
  .bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  select, button { padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:14px; }
  button { cursor:pointer; background:var(--accent); color:#fff; border:none; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card .v { font-size:26px; font-weight:600; } .card .l { color:var(--muted); font-size:12px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .wrap { overflow-x:auto; }
  .pill { padding:2px 8px; border-radius:99px; font-size:12px; color:#fff; }
  .OK,.done { background:var(--ok); } .ERROR,.failed { background:var(--bad); } .running,.NONE { background:var(--warn); }
  a { color:var(--accent); }
</style>
</head>
<body>
<h1>AI Code Quality Dashboard</h1>
<div class="bar">
  <select id="task"></select>
  <select id="provider"><option value="">default provider</option><option>anthropic</option><option>mock</option></select>
  <button onclick="startRun()">Run task</button>
  <button onclick="load()" style="background:var(--muted)">Refresh</button>
</div>
<div class="cards" id="cards"></div>
<div class="grid2">
  <div class="card"><canvas id="issues"></canvas></div>
  <div class="card"><canvas id="cov"></canvas></div>
</div>
<div class="card wrap">
  <table>
    <thead><tr><th>#</th><th>Task</th><th>Model</th><th>Status</th><th>Gate</th><th>Bugs</th><th>Vuln</th><th>Smells</th><th>Cov %</th><th>Dup %</th><th>LOC</th><th>Debt (min)</th><th>Rel/Sec/Maint</th><th>Gen (s)</th><th>Sonar</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
let charts = {};
const n = v => (v === null || v === undefined || v === "") ? "-" : v;
async function load() {
  const runs = await (await fetch("/api/runs")).json();
  const done = runs.filter(r => r.status === "done");
  const avg = k => done.length ? (done.reduce((a, r) => a + Number(r.metrics[k] || 0), 0) / done.length).toFixed(1) : "-";
  const passRate = done.length ? Math.round(100 * done.filter(r => r.quality_gate === "OK").length / done.length) + "%" : "-";
  document.getElementById("cards").innerHTML = [
    ["Total runs", runs.length], ["Gate pass rate", passRate], ["Avg bugs", avg("bugs")],
    ["Avg vulnerabilities", avg("vulnerabilities")], ["Avg code smells", avg("code_smells")], ["Avg coverage %", avg("coverage")]
  ].map(([l, v]) => `<div class="card"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");

  document.getElementById("rows").innerHTML = runs.map(r => {
    const m = r.metrics || {};
    return `<tr><td>${r.id}</td><td>${r.task_name}</td><td>${r.model}</td>
      <td><span class="pill ${r.status}" title="${(r.error || r.step || "").replace(/"/g, "'")}">${r.status}</span></td>
      <td>${r.quality_gate ? `<span class="pill ${r.quality_gate}">${r.quality_gate}</span>` : "-"}</td>
      <td>${n(m.bugs)}</td><td>${n(m.vulnerabilities)}</td><td>${n(m.code_smells)}</td><td>${n(m.coverage)}</td>
      <td>${n(m.duplicated_lines_density)}</td><td>${n(m.ncloc)}</td><td>${n(m.sqale_index)}</td>
      <td>${n(m.reliability_rating)}/${n(m.security_rating)}/${n(m.sqale_rating)}</td>
      <td>${r.gen_seconds ? r.gen_seconds.toFixed(1) : "-"}</td>
      <td>${r.sonar_url ? `<a href="${r.sonar_url}" target="_blank">open</a>` : "-"}</td></tr>`;
  }).join("");

  const ordered = [...done].reverse();
  const labels = ordered.map(r => `#${r.id} ${r.model}`);
  draw("issues", "bar", labels, [
    { label: "Bugs", data: ordered.map(r => +r.metrics.bugs || 0), backgroundColor: "#d85a30" },
    { label: "Vulnerabilities", data: ordered.map(r => +r.metrics.vulnerabilities || 0), backgroundColor: "#ba7517" },
    { label: "Code smells", data: ordered.map(r => +r.metrics.code_smells || 0), backgroundColor: "#378add" },
  ], "Issues per run");
  draw("cov", "line", labels, [
    { label: "Coverage %", data: ordered.map(r => +r.metrics.coverage || 0), borderColor: "#1d9e75" },
    { label: "Duplication %", data: ordered.map(r => +r.metrics.duplicated_lines_density || 0), borderColor: "#7f77dd" },
  ], "Coverage & duplication");
}
function draw(id, type, labels, datasets, title) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), { type, data: { labels, datasets },
    options: { plugins: { title: { display: true, text: title } }, responsive: true } });
}
async function startRun() {
  const body = { task_file: document.getElementById("task").value };
  const p = document.getElementById("provider").value; if (p) body.provider = p;
  await fetch("/api/runs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  load();
}
(async () => {
  const tasks = await (await fetch("/api/tasks")).json();
  document.getElementById("task").innerHTML = tasks.map(t => `<option value="${t.file}">${t.name}</option>`).join("");
  load(); setInterval(load, 5000);
})();
</script>
</body>
</html>
